<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report Details — Back2U</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
  .details-wrap{
    max-width:760px;
    margin:0 auto;
    padding:150px 24px 100px;
  }

  .details-back{
    display:inline-block;
    margin-bottom:28px;
    font-size:13px;
    color:var(--ink-soft);
  }

  .details-card{
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    background:var(--white);
    padding:28px;
  }

  .details-image{
    width:100%;
    max-height:380px;
    object-fit:cover;
    border-radius:var(--radius-md);
    background:var(--bg-alt);
    margin-bottom:28px;
  }

  .details-top{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
  }

  .details-type{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .details-title{
    font-size:34px;
    font-family:'Instrument Serif', serif;
    font-style:italic;
  }

  .details-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    border-top:1px solid var(--line);
    padding-top:24px;
  }

  .detail-box.full{
    grid-column:1 / -1;
  }

  .detail-label{
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .detail-value{
    font-size:14px;
    line-height:1.6;
  }

  .details-loading{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-soft);
  }

  @media(max-width:640px){
    .details-grid{
      grid-template-columns:1fr;
    }

    .detail-box.full{
      grid-column:auto;
    }

    .details-top{
      flex-direction:column;
    }
  }
</style>
</head>

<body>

<nav class="nav">
  <a class="nav-logo" href="main_screen.html">Back2U</a>

  <div class="nav-links">
    <a class="nav-link" href="report_lost.html">Report Lost</a>
    <a class="nav-link" href="report_found.html">Report Found</a>
    <a class="nav-link active" href="my_reports.html">My Matches</a>
  </div>

  <div class="nav-actions"></div>
</nav>


<div class="details-wrap">

  <a class="details-back" href="my_reports.html">
    ← Back to My Matches
  </a>

  <div id="reportDetails">
    <div class="details-loading">
      Loading report…
    </div>
  </div>

</div>


<footer class="footer">
  <div class="serif" style="font-size:22px;">Back2U</div>
  <div class="footer-copy">© Back2U</div>
</footer>

<script src="all.js"></script>

</body>
</html>
