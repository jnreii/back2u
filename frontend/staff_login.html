<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — Back2U</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /*card sits at center of the screen */
  .staff_login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:140px 24px 60px;
  }
  .staff_login-card{
    width:100%; max-width:420px;
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:0 30px 60px -24px rgba(0,0,0,0.12);
    padding:40px;
  }
  .staff_login-card h1{font-size:28px; font-style:italic; margin-bottom:6px;}
  .staff_login-card .sub{margin-bottom:26px;}
</style>
</head>
<body>
  <!--nav bar-->
<nav class="nav">
  <a class="nav-logo" href="main_screen.html">Back2U</a>
  <div class="nav-links">
    <a class="nav-link" href="report_lost.html">Report Lost</a>
    <a class="nav-link" href="report_found.html">Report Found</a>
    <a class="nav-link" href="my_reports.html">My Matches</a>
  </div>
  <div class="nav-actions">
    <a class="btn" href="main_screen.html">Back to Home</a>
  </div>
</nav>

<div class="staff_login-wrap">
  <div class="staff_login-card">
    <div class="eyebrow">✹ Staff Portal</div>
    <h1 class="serif">Staff sign-in</h1>
    <p class="sub">This portal is limited to registered venue staff. Sign in to continue.</p>
    <form id="staffLoginForm">
      <div class="field-group">
        <label class="field-label" for="staffEmail">Staff email</label>
        <input type="email" id="staffEmail" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="staffPassword">Password</label>
        <input type="password" id="staffPassword" placeholder="Enter your password" required>
      </div>
            <!--redirects to staff_review.html once signed in-->
      <button type="submit" class="btn btn-dark btn-lg btn-block" id="staffLoginBtn">Sign In to Staff Portal</button>
    </form>
  </div>
</div>

<footer class="footer">
  <div class="serif" style="font-size:22px;">Back2U</div>
  <div class="footer-copy">© Back2U</div>
</footer>

<script src="all.js"></script>

</body>
</html>
